    child_participation: "0..1"
    identifying: false
    fk_attributes: [발급신청번호]
    barker_sentence: 각 발급신청은 과금을 0개 또는 1개 발생시킬 수 있다. 각 과금은 발급신청 근거가 없거나 하나일 수 있다.
