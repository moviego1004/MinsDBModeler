    parent_participation: "0..M"
    child_participation: "0..1"
    identifying: false
    fk_attributes: [수정자이용자번호]
    barker_sentence: 각 이용자는 게시물을 0개 이상 수정할 수 있다. 각 게시물은 수정자가 없거나 하나일 수 있다.
  - id: R-CON-006
    parent: 이용자
    child: 게시물
    parent_to_child: 게시승인한다
    child_to_parent: 게시승인된다
    cardinality: "1:M"
