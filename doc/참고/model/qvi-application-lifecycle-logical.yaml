relationship_notation:
  participation:
    optional_one: "0..1"
    mandatory_one: "1..1"
    optional_many: "0..M"
    mandatory_many: "1..M"
  identifying_rule: 부모 FK가 자식 PK에 포함되면 식별관계이다.
  non_identifying_rule: FK가 필수라도 자식 PK에 포함되지 않으면 비식별 참조 관계이다.

