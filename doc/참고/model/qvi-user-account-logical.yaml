relationship_rules:
  - 서브타입 관계의 부모참여는 개별 관계 기준으로 0..1이지만, 서브타입 집합의 전체성과 배타성으로 정확히 하나의 서브타입을 강제한다.
  - 회원가입신청.생성이용자번호는 승인 전에는 선택이고, 승인 완료 상태에서는 필수이며 유일해야 한다.
  - 회원가입신청은 생성 시 최초 단계 이력을 함께 생성해야 한다.
  - 법인소속이력의 식별자는 법인회원이용자번호, 개인회원이용자번호, 유효시작일시이다.
  - 약관동의이력은 이용자번호 또는 가입신청번호 중 하나만 가져야 한다.
  - 공통 감사 FK는 감사 참조 관계로 관리하되 주요 Barker 다이어그램에서는 생략할 수 있다.
