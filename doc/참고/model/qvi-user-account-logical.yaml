subject_area: QVI 이용자/가입/계정
notation: Barker logical model
version: 0.1
status: draft
source_document: doc/DB설계/QVI 이용자 가입 계정 논리 모델.md
standard_document: doc/DB설계/QVI 상세 논리 모델 작성 기준.md

relationship_notation:
  participation:
    optional_one: "0..1"
    mandatory_one: "1..1"
    optional_many: "0..M"
    mandatory_many: "1..M"
  identifying_rule: 부모 FK가 자식 PK에 포함되면 식별관계이다.
  non_identifying_rule: FK가 필수라도 자식 PK에 포함되지 않으면 비식별 참조 관계이다.

subtype_sets:
  - id: ST-UAC-001
    supertype: 이용자
    subtypes: [QVI사업자, QVI직원, 회원, 외부기관]
    total: true
    disjoint: true
    discriminator: 이용자구분코드
    description: 모든 이용자는 네 서브타입 중 정확히 하나에 속한다.

  - id: ST-UAC-002
    supertype: 회원
    subtypes: [법인회원, 개인회원]
    total: true
    disjoint: true
    discriminator: 회원구분코드
    description: 모든 회원은 법인회원 또는 개인회원 중 정확히 하나에 속한다.

  - id: ST-UAC-003
    supertype: 개인회원
    subtypes: [법인소속개인회원, 일반개인회원]
    total: true
    disjoint: true
    discriminator: 개인회원구분코드
    description: 모든 개인회원은 법인소속개인회원 또는 일반개인회원 중 정확히 하나에 속한다.

